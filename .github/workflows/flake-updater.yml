name: update-flake-lock
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * 1,4"

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - name: Update flake
        run: nix develop --command nix flake update
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "ci(flake.lock): automatic update"
          branch: ci/flake-lock-update
          title: "ci(flake.lock): automatic update"
          body: updated flake.lock
          assignees: yolofanhd
          reviewers: yolofanhd
