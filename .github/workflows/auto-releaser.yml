name: Sync stable branch

on:
  schedule:
    - cron: "0 0 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    name: Open stable sync pull request
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh pr list --base stable --head main --state open --json number --jq 'length > 0' | grep -qx true; then
            gh pr create \
              --base stable \
              --head main \
              --title "chore: sync main into stable" \
              --body "Automated synchronization of the validated main branch."
          fi
